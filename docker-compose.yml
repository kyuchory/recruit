services:
  postgres:
    # PostgreSQL 18 (satisfies the design's "16+"; local image reused to avoid a
    # registry pull). The 18+ images use the pg_ctlcluster data layout, so the
    # volume mounts at /var/lib/postgresql, not /var/lib/postgresql/data.
    image: postgres:18.4
    container_name: recruit-inbox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruit_inbox}
      POSTGRES_USER: ${POSTGRES_USER:-recruit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruit_local_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruit} -d ${POSTGRES_DB:-recruit_inbox}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: recruit-inbox-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
