spring:
  application:
    name: recruit-inbox-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recruit_inbox}
    username: ${SPRING_DATASOURCE_USERNAME:recruit}
    password: ${SPRING_DATASOURCE_PASSWORD:recruit_local_pw}
    hikari:
      maximum-pool-size: 10
      pool-name: recruit-inbox-pool

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates mapped entities against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: recruit-inbox:session

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    org.flywaydb: info
    org.hibernate.SQL: warn

ai:
  enabled: ${AI_ENABLED:false}
  provider: openai
  text-model: ${AI_MODEL_TEXT:gpt-4o-mini}
  vision-model: ${AI_MODEL_VISION:gpt-4o-mini}
  max-input-tokens: 6000
  max-output-tokens: 1200
  request-timeout-ms: 45000
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

parser:
  enabled: ${PARSER_ENABLED:true}
  fetch:
    allow-private-hosts: ${PARSER_ALLOW_PRIVATE_HOSTS:false}

storage:
  provider: ${STORAGE_PROVIDER:local}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
  local:
    base-dir: ${STORAGE_LOCAL_DIR:}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:}
    endpoint: ${S3_ENDPOINT:}

notifications:
  enabled: ${NOTIFICATIONS_ENABLED:true}
  dispatch-interval-ms: 15000
