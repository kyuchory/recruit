spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
        provider:
          google:
            issuer-uri: https://accounts.google.com

app:
  auth:
    require-authentication: true
  profile:
    encryption-key: ${PROFILE_ENCRYPTION_KEY}
